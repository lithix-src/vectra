[project]
name = "vectra-api"
version = "0.1.0"
description = "VECTRA FastAPI Intelligence & Advisory OS Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "instructor>=1.6.0",
    "python-pptx>=1.0.2",
    "httpx>=0.27.2",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "vectra-db",
]

[tool.uv.sources]
vectra-db = { path = "../../packages/db", editable = true }

[tool.setuptools]
py-modules = ["main", "pptx_generator", "llm_runtime", "mcp_gateway"]

