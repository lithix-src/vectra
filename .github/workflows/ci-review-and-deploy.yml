name: VECTRA Team Code Review, RLS Audit & Build Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  review-and-verify:
    name: Automated Code Review, ToC Audit, TypeScript & 8-Stage RLS Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VECTRA Monorepo
        uses: actions/checkout@v4

      - name: Install Astral uv (Latest Standard CPython)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Node.js 24 LTS & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack & Install Workspace Packages
        run: |
          corepack enable
          pnpm install --ignore-scripts

      - name: Provision Latest Managed CPython & Run Full Team Review Gate
        run: |
          uv run python scripts/vectra_cli.py setup
          uv run python scripts/vectra_cli.py review
          pnpm --filter @vectra/web build
          uv run python scripts/vectra_cli.py clean
