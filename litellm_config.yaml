# =============================================================================
# VECTRA — Sovereign Local LiteLLM Proxy Configuration (litellm_config.yaml)
# Zero Commercial Cloud APIs — Routes strictly across local Ollama, vLLM, and llama.cpp
# Usage:
#   litellm --config litellm_config.yaml --port 4000
# =============================================================================

model_list:
  # 1. Default Primary Advisory & Subgraph Co-Pilot Model (Ollama)
  - model_name: ollama/qwen2.5:14b-instruct
    litellm_params:
      model: ollama_chat/qwen2.5:14b-instruct
      api_base: http://localhost:11434

  # 2. Fast Secondary / Fallback Local Model (Ollama)
  - model_name: ollama/llama3.3:8b
    litellm_params:
      model: ollama_chat/llama3.3:8b
      api_base: http://localhost:11434

  # 3. Deep Reasoning / Contrarian Audit Local Model (Ollama DeepSeek-R1 Distill)
  - model_name: ollama/deepseek-r1:14b
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: http://localhost:11434

  # 4. Local Semantic Embedding Model (Ollama nomic-embed-text -> Projected to 1536-d)
  - model_name: ollama/nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://localhost:11434

  # 5. Local High-Throughput GPU Serving (vLLM OpenAI-Compatible Server)
  - model_name: vllm/Qwen2.5-14B-Instruct
    litellm_params:
      model: openai/Qwen/Qwen2.5-14B-Instruct
      api_base: http://localhost:8001/v1
      api_key: local-vllm-no-key-required

  # 6. Local GGUF Workstation Server (llama.cpp / llama-server)
  - model_name: llamacpp/local-gguf
    litellm_params:
      model: openai/qwen2.5-14b-instruct-q4_k_m.gguf
      api_base: http://localhost:8080/v1
      api_key: local-llamacpp-no-key-required

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 30
  fallbacks:
    - {"ollama/qwen2.5:14b-instruct": ["ollama/llama3.3:8b", "llamacpp/local-gguf"]}

litellm_settings:
  telemetry: false
  drop_params: true
  set_verbose: false
